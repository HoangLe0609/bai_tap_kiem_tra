{% extends "base.html" %}

{% block title %}Thêm danh mục sách{% endblock %}

{% block content %}

<h3 class="mb-4">THÊM DANH MỤC SÁCH</h3>

<div class="card shadow">
    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Tên danh mục
                </label>

                <input type="text"
                       name="ten_danh_muc"
                       class="form-control"
                       maxlength="100"
                       required
                       placeholder="Nhập tên danh mục">
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Mô tả
                </label>

                <textarea name="mo_ta"
                          class="form-control"
                          rows="3"
                          maxlength="255"
                          placeholder="Nhập mô tả danh mục"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Lưu danh mục
            </button>

            <a href="{{ url_for('danh_muc_list') }}"
               class="btn btn-secondary">
                Quay lại
            </a>

        </form>

    </div>
</div>

{% endblock %}
